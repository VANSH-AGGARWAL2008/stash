name: stash
description: A personal save-for-later inbox app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  url_launcher: ^6.3.3
  receive_sharing_intent: ^1.9.0
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  share_plus: ^13.3.1
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon-black.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-black.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon-black.png"
